<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Battery Status</h1>
        
        <div class="battery-display">
            <div id="battery" class="battery-icon battery-good">
                <svg width="80" height="40" viewBox="0 0 48 24">
                    <rect x="1" y="4" width="40" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                    <rect x="41" y="8" width="6" height="8" rx="1" fill="currentColor"/>
                    <rect id="battery-fill" x="3" y="6" width="36" height="12" rx="1" fill="currentColor"/>
                </svg>
            </div>
            <div class="battery-info">
                <div class="percentage"><span id="pct">--</span>%</div>
                <div class="voltage"><span id="voltage">--</span>V</div>
                <div class="status" id="status">--</div>
            </div>
        </div>
        
        <div class="updated">Last updated: <span id="timestamp">--</span></div>
    </div>

    <script>
        function updateBattery() {
            fetch('battery_status.php')
                .then(r => r.json())
                .then(data => {
                    let pct = data.percentage;
                    let voltage = data.voltage;
                    
                    document.getElementById('pct').textContent = pct;
                    document.getElementById('voltage').textContent = voltage;
                    document.getElementById('timestamp').textContent = data.timestamp;
                    
                    document.getElementById('battery-fill').setAttribute('width', (pct / 100) * 36);
                    document.getElementById('battery').title = voltage + 'V (' + pct + '%)';
                    
                    let status, color;
                    if (pct > 50) {
                        status = 'Good';
                        color = '#4CAF50';
                        document.getElementById('battery').className = 'battery-icon battery-good';
                    } else if (pct > 20) {
                        status = 'Low';
                        color = '#FF9800';
                        document.getElementById('battery').className = 'battery-icon battery-low';
                    } else {
                        status = 'Critical';
                        color = '#F44336';
                        document.getElementById('battery').className = 'battery-icon battery-critical';
                    }
                    
                    document.getElementById('battery-fill').style.fill = color;
                    document.getElementById('status').textContent = status;
                })
                .catch(err => {
                    document.getElementById('status').textContent = 'Error';
                });
        }
        
        updateBattery();
        setInterval(updateBattery, 5000);
    </script>
</body>
</html>
