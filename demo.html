<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
}

.battery-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

#battery-icon {
    display: block;
}

.battery-good { color: #4CAF50; }
.battery-low { color: #FF9800; }
.battery-critical { 
    color: #F44336;
    animation: battery-blink 1s ease-in-out infinite;
}

@keyframes battery-blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.4; }
}

.battery-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
}

.battery-pct {
    font-weight: bold;
    font-size: 18px;
}

.battery-voltage {
    font-size: 13px;
    opacity: 0.8;
}
</style>
</head>
<body>

<div id="battery" class="battery-container battery-good">
    <svg id="battery-icon" width="50" height="25" viewBox="0 0 48 24">
        <rect x="1" y="4" width="40" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="41" y="8" width="6" height="8" rx="1" fill="currentColor"/>
        <rect id="battery-fill" x="3" y="6" width="36" height="12" rx="1" fill="currentColor"/>
    </svg>
    <div class="battery-text">
        <span class="battery-pct">100%</span>
        <span class="battery-voltage">8.4V</span>
    </div>
</div>

<script>
let levels = [
    { pct: 100, voltage: 8.4, fill: 36, state: 'good' },
    { pct: 75, voltage: 7.8, fill: 27, state: 'good' },
    { pct: 50, voltage: 7.2, fill: 18, state: 'good' },
    { pct: 25, voltage: 6.6, fill: 9, state: 'low' },
    { pct: 10, voltage: 6.2, fill: 4, state: 'critical' }
];

let currentIndex = 0;

setInterval(() => {
    currentIndex = (currentIndex + 1) % levels.length;
    let level = levels[currentIndex];
    
    document.getElementById('battery-fill').setAttribute('width', level.fill);
    document.querySelector('.battery-pct').textContent = level.pct + '%';
    document.querySelector('.battery-voltage').textContent = level.voltage.toFixed(1) + 'V';
    
    let battery = document.getElementById('battery');
    battery.className = 'battery-container battery-' + level.state;
    
}, 1500);
</script>

</body>
</html>
